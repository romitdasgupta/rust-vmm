[package]
name = "hvf"
version = "0.1.0"
authors = ["The rust-vmm authors"]
description = "Safe wrappers over the macOS Hypervisor.framework (Apple silicon)"
repository.workspace = true
readme = "README.md"
keywords = ["hvf", "hypervisor", "macos", "virtualization"]
categories = ["os::macos-apis", "virtualization"]
license = "Apache-2.0 OR BSD-3-Clause"
edition = "2024"
rust-version = "1.88"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]
all-features = true

[features]
# Adds `Vm::map_guest_memory` for mapping a `vm_memory::GuestMemory` into the VM.
vm-memory = ["dep:vm-memory"]

[dependencies]
bitflags = "2"
hvf-bindings = { workspace = true }
vm-memory = { workspace = true, optional = true, features = ["backend-mmap"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.39"

[dev-dependencies]
vm-device = { path = "../../vm-device" }
vm-memory = { workspace = true, features = ["backend-mmap"] }

# Used by the `boot_linux` example and its test, which only build there.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
linux-loader = { path = "../../linux-loader" }
vm-fdt = "0.3.0"

[[example]]
name = "boot_linux"
# `Vm::map_guest_memory` maps the vm-memory guest RAM.
required-features = ["vm-memory"]
# Run the unit tests of the example (argument parsing, device models) with
# `cargo test`; they do not need Hypervisor.framework.
test = true

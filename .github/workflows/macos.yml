name: macOS

# Builds, lints and tests the workspace on Apple silicon macOS.
#
# GitHub-hosted macOS runners are virtual machines without nested
# virtualization, so the Hypervisor.framework tests of `hvf-bindings` and
# `hvf` print `SKIP` and pass here. They run for real on the self-hosted
# Buildkite agents described in `.buildkite/pipeline.macos.yml`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with the toolchain of the rustvmm/dev container used by the
  # Linux Buildkite CI (`RUST_TOOLCHAIN` in rust-vmm-container's docker.env).
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  macos:
    name: aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target x86_64-apple-darwin
        rustup default "$RUST_TOOLCHAIN"
        rustc --version
        xcrun --show-sdk-version

    - name: Check formatting
      run: cargo fmt --all -- --check --config format_code_in_doc_comments=true

    - name: Check the workspace
      run: cargo check --workspace --all-targets
      env:
        RUSTFLAGS: "-D warnings"

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks

    - name: Clippy (hvf crates, all features)
      run: cargo clippy -p hvf-bindings -p hvf --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks

    # Intel Macs get the types and constants of hvf-bindings, so make sure
    # the hvf crates also build without warnings there.
    - name: Clippy (hvf crates, x86_64-apple-darwin)
      run: cargo clippy -p hvf-bindings -p hvf --all-targets --all-features --target x86_64-apple-darwin -- -D warnings -D clippy::undocumented_unsafe_blocks

    - name: Test the workspace
      run: cargo test --workspace

    - name: Test vm-memory with the mmap backends
      run: cargo test -p vm-memory --features backend-mmap,backend-bitmap,backend-atomic,iommu

    - name: Test the hvf crates with all features
      run: cargo test -p hvf-bindings -p hvf --all-features

    - name: Check the bindings against the SDK headers
      run: cargo test -p hvf-bindings --test sdk_check
      env:
        HVF_SDK_CHECK: "1"

    - name: Build the hvf documentation
      run: cargo doc -p hvf -p hvf-bindings --all-features --no-deps
      env:
        RUSTDOCFLAGS: "-D warnings"

    # `direct` can only be named through the identifier itself, so a whole-word
    # match also catches `hv::direct::`, `functions::direct` and `direct` in a
    # `use hvf_bindings::{...}` list. grep exits 1 for "no match" and 2 for an
    # error, which must not pass as "no match".
    - name: Check that hvf only uses run-time resolved newer functions
      run: |
        status=0
        grep -rnw direct hvf/hvf/src || status=$?
        if [ "$status" -eq 0 ]; then
          echo "hvf must call functions newer than macOS 11.0 through DynApi, not hvf_bindings::direct" >&2
          exit 1
        elif [ "$status" -ne 1 ]; then
          echo "grep failed with status $status" >&2
          exit 2
        fi
